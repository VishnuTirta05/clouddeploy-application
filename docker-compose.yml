services:

  web:
    build: .
    container_name: clouddeploy-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: clouddeploy-db
    environment:
      POSTGRES_DB: clouddeploy
      POSTGRES_USER: clouddeploy
      POSTGRES_PASSWORD: clouddeploy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: