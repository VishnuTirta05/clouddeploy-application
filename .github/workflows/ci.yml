
name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clouddeploy
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: clouddeploy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clouddeploy -d clouddeploy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          POSTGRES_DB: clouddeploy
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: clouddeploy_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "True"
        run: python manage.py migrate

      - name: Run tests
        env:
          POSTGRES_DB: clouddeploy
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: clouddeploy_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "True"
        run: pytest

      - name: Build Docker image
        run: docker build -t clouddeploy:test .

